events {
    worker_connections 1024;
}

http {
    # Define an upstream pool that delegates the active server entry to an included snippet
    upstream backend_nodes {
        include /etc/nginx/conf.d/active_upstream.conf;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://backend_nodes;

            # Pass original request metadata to the upstream
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # Ensure Nginx times out fast if a slot dies, rather than hanging the client
            proxy_connect_timeout 2s;
            proxy_read_timeout 5s;
        }
    }
}
